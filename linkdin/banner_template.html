<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    width: 1584px;
    height: 396px;
    background: #090d16;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
  }

  /* Tech Grid Pattern */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index: 1;
  }

  /* Vibrant Ambient Glows */
  .glow-left {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
    top: -150px;
    left: -100px;
    border-radius: 50%;
    z-index: 2;
  }

  .glow-right {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.22) 0%, rgba(14, 165, 233, 0) 70%);
    top: -180px;
    right: 50px;
    border-radius: 50%;
    z-index: 2;
  }

  .glow-accent {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(168, 85, 247, 0) 70%);
    bottom: -150px;
    right: 350px;
    border-radius: 50%;
    z-index: 2;
  }

  /* Left Avatar Safe Zone (Visual indicator only during design, transparent in production) */
  .avatar-safe-space {
    width: 380px;
    height: 100%;
    flex-shrink: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-left: 60px;
    padding-bottom: 35px;
  }

  .avatar-safe-space .mini-tag {
    color: rgba(148, 163, 184, 0.6);
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Main Content Area */
  .content {
    flex: 1;
    z-index: 10;
    padding-right: 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(99, 102, 241, 0.18);
    border: 1px solid rgba(165, 180, 252, 0.35);
    color: #c7d2fe;
    padding: 7px 18px;
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .badge-dot {
    width: 8px;
    height: 8px;
    background: #38bdf8;
    border-radius: 50%;
    box-shadow: 0 0 10px #38bdf8;
  }

  h1 {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1.1;
    background: linear-gradient(90deg, #ffffff 0%, #f1f5f9 40%, #93c5fd 80%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 20px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .subtitle .highlight {
    color: #38bdf8;
    font-weight: 700;
  }

  .subtitle .dot {
    color: #64748b;
  }

  /* Tech Chips */
  .tech-pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .pill {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #f8fafc;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 8px;
    backdrop-filter: blur(10px);
    letter-spacing: 0.3px;
  }

  .pill.accent {
    background: rgba(56, 189, 248, 0.12);
    border-color: rgba(56, 189, 248, 0.35);
    color: #7dd3fc;
  }

  .pill.highlight {
    background: rgba(168, 85, 247, 0.14);
    border-color: rgba(168, 85, 247, 0.35);
    color: #d8b4fe;
  }

  /* Right Decorative Tech Matrix */
  .tech-graphic {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.15;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-left"></div>
  <div class="glow-right"></div>
  <div class="glow-accent"></div>

  <!-- Left Side: Profile Picture Clearance Zone -->
  <div class="avatar-safe-space"></div>

  <!-- Center-Right: Core Messaging for Recruiters -->
  <div class="content">
    <div class="badge">
      <div class="badge-dot"></div>
      SWE Intern @ Ambiguity Labs • Open to SDE Opportunities
    </div>
    
    <h1>FULL-STACK SOFTWARE ENGINEER</h1>
    
    <div class="subtitle">
      <span>MERN Stack Architecture</span>
      <span class="dot">•</span>
      <span class="highlight">Autonomous AI Agents</span>
      <span class="dot">•</span>
      <span>Scalable RESTful APIs</span>
    </div>

    <div class="tech-pills">
      <div class="pill accent">React.js</div>
      <div class="pill">Node.js</div>
      <div class="pill">Express.js</div>
      <div class="pill">MongoDB</div>
      <div class="pill highlight">AI Agents &amp; LLMs</div>
      <div class="pill">RESTful APIs</div>
      <div class="pill">Docker</div>
      <div class="pill">Flipkart GRID R3</div>
      <div class="pill accent">🌐 vinayakmore.netlify.app</div>
    </div>
  </div>

  <svg class="tech-graphic" width="300" height="300" viewBox="0 0 100 100" fill="none" stroke="#38bdf8" stroke-width="0.5">
    <circle cx="50" cy="50" r="40" stroke-dasharray="2 2" />
    <circle cx="50" cy="50" r="30" />
    <circle cx="50" cy="50" r="20" stroke-dasharray="1 3" />
    <line x1="10" y1="50" x2="90" y2="50" />
    <line x1="50" y1="10" x2="50" y2="90" />
    <line x1="22" y1="22" x2="78" y2="78" />
    <line x1="22" y1="78" x2="78" y2="22" />
  </svg>
</body>
</html>
