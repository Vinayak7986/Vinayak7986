<svg fill="none" viewBox="0 0 850 230" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-container {
          width: 100%;
          height: 230px;
          border-radius: 16px;
          background: linear-gradient(135deg, #0b0f19 0%, #1e1b4b 45%, #0f172a 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          box-shadow: 0 12px 36px -10px rgba(99, 102, 241, 0.35);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .bg-glow-1 {
          position: absolute;
          width: 380px;
          height: 380px;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, rgba(99, 102, 241, 0) 70%);
          top: -120px;
          left: -80px;
          border-radius: 50%;
        }

        .bg-glow-2 {
          position: absolute;
          width: 360px;
          height: 360px;
          background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(14, 165, 233, 0) 70%);
          bottom: -130px;
          right: -70px;
          border-radius: 50%;
        }

        .tag-pill {
          background: rgba(99, 102, 241, 0.18);
          border: 1px solid rgba(165, 180, 252, 0.35);
          color: #c7d2fe;
          padding: 6px 16px;
          border-radius: 9999px;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.8px;
          margin-bottom: 12px;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          z-index: 2;
          text-transform: uppercase;
        }

        .name-title {
          font-size: 46px;
          font-weight: 900;
          letter-spacing: -0.5px;
          background: linear-gradient(90deg, #ffffff 0%, #e2e8f0 40%, #93c5fd 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0;
          line-height: 1.1;
          z-index: 2;
          text-align: center;
        }

        .role-subtitle {
          color: #cbd5e1;
          font-size: 15px;
          font-weight: 500;
          margin-top: 10px;
          margin-bottom: 14px;
          z-index: 2;
          text-align: center;
        }

        .role-highlight {
          color: #38bdf8;
          font-weight: 600;
        }

        .tech-chips {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          justify-content: center;
          z-index: 2;
        }

        .tech-chip {
          background: rgba(255, 255, 255, 0.08);
          border: 1px solid rgba(255, 255, 255, 0.12);
          color: #f1f5f9;
          font-size: 11px;
          font-weight: 600;
          padding: 4px 11px;
          border-radius: 6px;
          letter-spacing: 0.2px;
        }
      </style>

      <div class="banner-container">
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="tag-pill">💼 SOFTWARE ENGINEER • FULL-STACK &amp; AGENTIC AI</div>
        <h1 class="name-title">VINAYAK MORE</h1>
        <p class="role-subtitle">
          SWE Intern @ <span class="role-highlight">Ambiguity Labs</span> • Scalable MERN Architectures • RESTful APIs • JSPM RSCOE '27
        </p>
        <div class="tech-chips">
          <span class="tech-chip">React.js</span>
          <span class="tech-chip">Node.js</span>
          <span class="tech-chip">Express.js</span>
          <span class="tech-chip">MongoDB</span>
          <span class="tech-chip">RESTful APIs</span>
          <span class="tech-chip">AI Agents &amp; LLMs</span>
          <span class="tech-chip">Docker</span>
          <span class="tech-chip">MVC Architecture</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
